name: V2.30 V1.1 exact RAW integer-carrier repair

on:
  push:
    branches:
      - v230-v1-1-repair-runner
    paths:
      - '.github/workflows/v230_v1_1_repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair runner history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact V2.30 V1.1 two-parent repair commit
        shell: bash
        run: |
          set -euo pipefail

          production='experiment-v1.4.11-v2-brightness-4ev'
          runner_branch='v230-v1-1-repair-runner'
          authority='ddcefd30a4f203f83c6b67d131f63b1533cc4d66'
          authority_tree='ccbc7d5354373a383bc64870ec37dc733c835184'
          failed='14732c276a62576a6a6dfca85e4c358b90c87e0a'
          failed_tree='9f0955ae68da83bc2909571c3778fafa08afc7cd'
          repaired_tree_expected='4fd09b02019f72c1acc5f3bcb6cb6691c751970e'
          repair_patch_sha='8f14ea6a5c454af7dbd248a47b9cc6fdbc91d05d6bc1d07c06d67bbc27e90932'
          repair_workflow='.github/workflows/v230_v1_1_repair.yml'

          test "$GITHUB_REF_NAME" = "$runner_branch"
          test "$(git rev-parse HEAD^)" = "$failed"
          test "$(git rev-parse "$authority^{tree}")" = "$authority_tree"
          test "$(git rev-parse "$failed^{tree}")" = "$failed_tree"

          runner_delta="$(git diff --name-only "$failed" HEAD)"
          test "$runner_delta" = "$repair_workflow"

          candidate="$RUNNER_TEMP/v230-v1-1-candidate"
          rm -rf "$candidate"
          git worktree add --detach "$candidate" "$failed"

          repair_b64="$RUNNER_TEMP/v230-v1-1-repair.b64"
          repair_patch="$RUNNER_TEMP/v230-v1-1-repair.patch"
          printf '%s\n' '' > "$repair_b64"
          base64 -d "$repair_b64" > "$repair_patch"
          test "$(sha256sum "$repair_patch" | awk '{print $1}')" = "$repair_patch_sha"

          (
            cd "$candidate"
            git apply --check "$repair_patch"
            git apply --index --whitespace=nowarn "$repair_patch"

            correction_delta="$(git diff --cached --name-only | LC_ALL=C sort)"
            expected_correction_delta=$'.github/workflows/build.yml\nBUILD_WORKFLOW_COPY.yml\nPACKAGE_MANIFEST_SHA256.txt\napp/src/main/assets/shaders/raw_reconstruct.frag\napp/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java\nscripts/verify_orientation.py'
            test "$correction_delta" = "$expected_correction_delta"

            runtime_correction_delta="$(git diff --cached --name-only -- app/src | LC_ALL=C sort)"
            expected_runtime_correction_delta=$'app/src/main/assets/shaders/raw_reconstruct.frag\napp/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java'
            test "$runtime_correction_delta" = "$expected_runtime_correction_delta"

            repaired_tree="$(git write-tree)"
            test "$repaired_tree" = "$repaired_tree_expected"

            full_runtime_delta="$(git diff --name-only "$authority^{tree}" "$repaired_tree" -- app/src | LC_ALL=C sort)"
            expected_full_runtime_delta=$'app/src/main/assets/shaders/hdr_display.frag\napp/src/main/assets/shaders/raw_reconstruct.frag\napp/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java\napp/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java\napp/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java\napp/src/main/java/com/skyking0007/irishdrviewfinder/RawFusion.java'
            test "$full_runtime_delta" = "$expected_full_runtime_delta"

            full_delta="$(git diff --name-only "$authority^{tree}" "$repaired_tree" | LC_ALL=C sort)"
            expected_full_delta=$'.github/workflows/build.yml\nBUILD_WORKFLOW_COPY.yml\nPACKAGE_INFO.txt\nPACKAGE_MANIFEST_SHA256.txt\nREADME.md\nVSCODE_DEV_UPLOAD.txt\napp/build.gradle.kts\napp/src/main/assets/shaders/hdr_display.frag\napp/src/main/assets/shaders/raw_reconstruct.frag\napp/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java\napp/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java\napp/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java\napp/src/main/java/com/skyking0007/irishdrviewfinder/RawFusion.java\nscripts/verify_orientation.py'
            test "$full_delta" = "$expected_full_delta"

            cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml
            grep -Fq 'versionCode = 47' app/build.gradle.kts
            grep -Fq 'versionName = "1.0-v1.4.11-v2.30"' app/build.gradle.kts
            grep -Fq 'version "9.2.1"' build.gradle.kts
            grep -Fq 'GLES30.GL_R16UI' app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java
            grep -Fq 'GLES30.GL_RED_INTEGER' app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java
            ! grep -Fq 'GLES30.GL_R16,' app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java
            grep -Fq 'uniform highp usampler2D rawTex;' app/src/main/assets/shaders/raw_reconstruct.frag
            grep -Fq 'float(texelFetch(rawTex, q, 0).r)' app/src/main/assets/shaders/raw_reconstruct.frag
            sha256sum -c PACKAGE_MANIFEST_SHA256.txt
            python3 scripts/verify_shaders.py
            IRIS_WORKFLOW_SYNTAX_ONLY=1 python3 scripts/verify_orientation.py
          )

          repaired_tree="$(cd "$candidate" && git write-tree)"
          test "$repaired_tree" = "$repaired_tree_expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          message=$'V1.4.11 V2.30 V1.1 repair RAW integer texture carrier\n\nReplace the invalid GLES30.GL_R16 RAW upload with the Android GLES30-supported GL_R16UI + GL_RED_INTEGER uint16 carrier and matching usampler2D shader input, without changing V2.30 RAW fusion architecture.'
          repair_commit="$(printf '%s\n' "$message" | git commit-tree "$repaired_tree" -p "$authority" -p "$failed")"

          test "$(git rev-parse "$repair_commit^{tree}")" = "$repaired_tree_expected"
          test "$(git show -s --format=%P "$repair_commit")" = "$authority $failed"
          git merge-base --is-ancestor "$failed" "$repair_commit"

          git fetch --no-tags origin "+refs/heads/$production:refs/remotes/origin/$production"
          test "$(git rev-parse "refs/remotes/origin/$production")" = "$failed"

          git push origin "$repair_commit:refs/heads/$production"

          echo "V1.4.11 V2.30 V1.1 REPAIR COMMIT: PASS"
          echo "REPAIR COMMIT: $repair_commit"
          echo "FIRST PARENT AUTHORITY: $authority"
          echo "SECOND PARENT FAILED V2.30: $failed"
          echo "FAILED->V1.1 RUNTIME DELTA: exactly HdrGlView.java + raw_reconstruct.frag"
          echo "V2.29->V1.1 RUNTIME DELTA: exactly 6 intended V2.30 runtime files"
          echo "BUILD PROCEDURE: existing V2.30 workflow inherited from successful V2.29 mechanics"
          echo "NEXT: manually dispatch the existing V2.30 build workflow on $production"
