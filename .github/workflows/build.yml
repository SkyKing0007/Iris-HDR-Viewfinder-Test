name: Build Iris HDR Viewfinder Test V1.3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - 'BUILD_WORKFLOW_COPY.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap authority and upload-shape proof
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_NAME" = "main"
          cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml
          grep -Fq 'versionCode = 4' app/build.gradle.kts
          grep -Fq 'versionName = "1.0-v1.3"' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'minSdk = 29' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          grep -Fq 'version "9.2.1"' build.gradle.kts
          sha256sum -c PACKAGE_MANIFEST_SHA256.txt

          bad_platform='platforms;android-37'
          if grep -Fq "sdkmanager \"$bad_platform\"" .github/workflows/build.yml; then
            echo 'REGRESSION FAIL 001: invalid API 37 package identifier survived' >&2
            exit 1
          fi

          if grep -RFn 'readAllBytes(' app/src/main/java; then
            echo 'REGRESSION FAIL 003: API-33 InputStream.readAllBytes survived minSdk 29 source' >&2
            exit 1
          fi

          python3 scripts/verify_orientation.py

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          expected_tracked = [
              '.github/workflows/build.yml',
              '.gitignore',
              'BUILD_WORKFLOW_COPY.yml',
              'PACKAGE_INFO.txt',
              'PACKAGE_MANIFEST_SHA256.txt',
              'README.md',
              'VSCODE_DEV_UPLOAD.txt',
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/assets/shaders/fullscreen.vert',
              'app/src/main/assets/shaders/hdr_display.frag',
              'app/src/main/assets/shaders/yuv_to_rgb.frag',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/YuvFrame.java',
              'build.gradle.kts',
              'gradle.properties',
              'scripts/verify_orientation.py',
              'scripts/verify_shaders.py',
              'settings.gradle.kts',
          ]
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          if tracked != expected_tracked:
              missing = sorted(set(expected_tracked) - set(tracked))
              extra = sorted(set(tracked) - set(expected_tracked))
              raise SystemExit(
                  f'REGRESSION FAIL 002: upload shape mismatch; missing={missing} extra={extra}')

          root = Path('app/src')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          expected_runtime_paths = [
              'app/src/main/AndroidManifest.xml',
              'app/src/main/assets/shaders/fullscreen.vert',
              'app/src/main/assets/shaders/hdr_display.frag',
              'app/src/main/assets/shaders/yuv_to_rgb.frag',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/YuvFrame.java',
          ]
          actual_runtime_paths = [p.as_posix() for p in files]
          if actual_runtime_paths != expected_runtime_paths:
              raise SystemExit(
                  'BOOTSTRAP AUTHORITY FAIL: runtime path set mismatch: '
                  f'{actual_runtime_paths}')
          rows = []
          for p in files:
              data = p.read_bytes()
              lines = data.count(b'\n') + (1 if data and not data.endswith(b'\n') else 0)
              rows.append(
                  f"{hashlib.sha256(data).hexdigest()}\t{len(data)}\t{lines}\t{p.as_posix()}\n")
          manifest = ''.join(rows).encode()
          digest = hashlib.sha256(manifest).hexdigest()
          expected = 'd83f8661fd35374eaa24642d647204c594168fbce25c55763fd3804fbec612b4'
          if digest != expected:
              raise SystemExit(
                  f'BOOTSTRAP AUTHORITY FAIL: runtime manifest sha256 {digest} != {expected}')
          Path('bootstrap-runtime-manifest.tsv').write_bytes(manifest)
          unchanged_from_v12 = {
              'app/src/main/assets/shaders/fullscreen.vert': '7d8ee58c4500a46dd9614404a17ea4c7e104a6bf43976ecb85795799fdcd7fb4',
              'app/src/main/assets/shaders/yuv_to_rgb.frag': '40983986d9a7aac5ea9a4ef9aea37be2aba6d750054e94daea1af4efa3be64fc',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java': '751d2926f5e365f776cee2afcd84096898d1fd1a693736ec98986d4654b58092',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java': '60e51ef2d1e081e62bac23625efd21eaff5832e36867b669f24c3e62e3c6bdfb',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java': 'a975fb65529c864a8bcefcded6c5df68fa881e7f97040734c6b0e326d27cc110',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/YuvFrame.java': '5c4f319be05c122e5fa33d2b8e261610ea2210e69567e50186d93ff092f3c146',
          }
          for rel, expected_sha in unchanged_from_v12.items():
              actual_sha = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if actual_sha != expected_sha:
                  raise SystemExit(
                      f'V1.2 AUTHORITY INVARIANCE FAIL: {rel} {actual_sha} != {expected_sha}')
          print(f'BOOTSTRAP AUTHORITY PASS: 25 tracked files; 12 runtime files; manifest={digest}; unchanged V1.2 runtime=6/6')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and prove Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > "$RUNNER_TEMP/sdkmanager-list.txt"
          grep -Fq 'platforms;android-37.0' "$RUNNER_TEMP/sdkmanager-list.txt"
          sdkmanager "platforms;android-37.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"
          echo 'API37 PACKAGE REGRESSION PASS: platforms;android-37.0 installed'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prove Gradle toolchain
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          java -version

      - name: Install real GLSL compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator --version

      - name: Scan GLSL reserved identifiers
        shell: bash
        run: python3 scripts/verify_shaders.py

      - name: Compile exact runtime GLSL assets
        shell: bash
        run: |
          set -euo pipefail
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/yuv_to_rgb.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/hdr_display.frag

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Post-build invariance and freeze compiled candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          if grep -RFn 'readAllBytes(' app/src/main/java; then
            echo 'POST-BUILD REGRESSION FAIL: API-33 readAllBytes returned' >&2
            exit 1
          fi
          python3 scripts/verify_orientation.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          expected_runtime = 'd83f8661fd35374eaa24642d647204c594168fbce25c55763fd3804fbec612b4'
          root = Path('app/src')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          rows = []
          for p in files:
              data = p.read_bytes()
              lines = data.count(b'\n') + (1 if data and not data.endswith(b'\n') else 0)
              rows.append(
                  f"{hashlib.sha256(data).hexdigest()}\t{len(data)}\t{lines}\t{p.as_posix()}\n")
          manifest = ''.join(rows).encode()
          digest = hashlib.sha256(manifest).hexdigest()
          if len(files) != 12 or digest != expected_runtime:
              raise SystemExit(
                  f'POST-BUILD RUNTIME INVARIANCE FAIL: files={len(files)} digest={digest}')
          Path('bootstrap-runtime-manifest.tsv').write_bytes(manifest)

          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          repo_rows = []
          for rel in tracked:
              p = Path(rel)
              data = p.read_bytes()
              lines = data.count(b'\n') + (1 if data and not data.endswith(b'\n') else 0)
              repo_rows.append(
                  f"{hashlib.sha256(data).hexdigest()}\t{len(data)}\t{lines}\t{rel}\n")
          Path('compiled-repository-manifest.tsv').write_text(''.join(repo_rows))
          print(f'POST-BUILD RUNTIME INVARIANCE PASS: 12 files, manifest={digest}')
          PY

          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ ${#apks[@]} -ne 1 ]]; then
            printf 'Expected exactly one APK, found %s\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]:-}" >&2
            exit 1
          fi

          mkdir -p output
          cp "${apks[0]}" output/Iris-HDR-Viewfinder-Test-V1.3-debug.apk
          git archive --format=tar --output=output/Iris-HDR-Viewfinder-Test-V1.3-source-candidate.tar "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > output/SOURCE_COMMIT.txt
          cp bootstrap-runtime-manifest.tsv output/RUNTIME_SOURCE_MANIFEST.tsv
          cp compiled-repository-manifest.tsv output/REPOSITORY_SOURCE_MANIFEST.tsv
          cat > output/REGRESSIONS.txt <<'EOF'
          001 - API 37 sdkmanager package must be platforms;android-37.0, never platforms;android-37.
          002 - vscode.dev upload must preserve the complete 25-file tracked candidate and all 12 app/src runtime files.
          003 - minSdk 29 runtime source must not call InputStream.readAllBytes(), which is Android API 33+.
          004 - Preview/UI must follow fullUser orientation and never force the historical landscape-only Activity.
          005 - Camera2 YUV top-left origin correction must occur exactly once; final display UVs must not flip again.
          006 - NORMAL/HDR and SPLIT preview sampling must preserve rotated aspect ratio by center crop, never stretch.
          007 - Still SHORT/LONG JPEG orientation must follow device orientation, and fused JPEG must normalize EXIF-only HAL rotation before pixel fusion.
          EOF
          sha256sum output/Iris-HDR-Viewfinder-Test-V1.3-debug.apk \
                    output/Iris-HDR-Viewfinder-Test-V1.3-source-candidate.tar \
                    output/RUNTIME_SOURCE_MANIFEST.tsv \
                    output/REPOSITORY_SOURCE_MANIFEST.tsv \
                    output/REGRESSIONS.txt | tee output/SHA256SUMS.txt

      - name: Upload compiled authority artifact
        uses: actions/upload-artifact@v4
        with:
          name: Iris-HDR-Viewfinder-Test-V1.3
          path: output/
          if-no-files-found: error
          retention-days: 14
