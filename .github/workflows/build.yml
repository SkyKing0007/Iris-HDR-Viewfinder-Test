name: Build Iris HDR Viewfinder Test V1.5.4 V1.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - 'BUILD_WORKFLOW_COPY.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download exact successful V1.5.4 Actions authority artifact
        uses: actions/download-artifact@v4
        with:
          name: Iris-HDR-Viewfinder-Test-V1.5.4
          path: ${{ runner.temp }}/v154-authority-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33706757668

      - name: Reconstruct exact V1.5.4 authority and prove V1.5.4 V1.1 candidate before compilers
        shell: bash
        run: |
          set -euo pipefail
          authority='b352a4f12f011496f8c0eeb3a51553b35cc33c48'
          authority_tree='8b09e5ab8e647a82cea1330473a4c259c9738f54'
          authority_dir="$RUNNER_TEMP/v154-authority-artifact"
          authority_src="$RUNNER_TEMP/v154-authority-source"
          canonical="$RUNNER_TEMP/v154v11-canonical-candidate"

          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = 'main'
          test "$(git rev-parse HEAD^)" = "$authority"
          test "$(git rev-parse "$authority^{tree}")" = "$authority_tree"
          cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml
          grep -Fq 'versionCode = 34' app/build.gradle.kts
          grep -Fq 'versionName = "1.0-v1.5.4-v1.1"' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'minSdk = 29' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          grep -Fq 'version "9.2.1"' build.gradle.kts
          sha256sum -c PACKAGE_MANIFEST_SHA256.txt

          test "$(sha256sum "$authority_dir/Iris-HDR-Viewfinder-Test-V1.5.4-debug.apk" | awk '{print $1}')" = '53f9a84767b92c088e88d882bb2e7ba1a6fef8489a9f759db3498eab25b326e6'
          test "$(sha256sum "$authority_dir/Iris-HDR-Viewfinder-Test-V1.5.4-source-candidate.tar" | awk '{print $1}')" = '99139eb5df3000656608a60cff112d07744ab63d20a17f64df0eb3f0c3ec110d'
          test "$(sha256sum "$authority_dir/RUNTIME_SOURCE_MANIFEST.tsv" | awk '{print $1}')" = 'eafb637ae41d304e75afc4376957ec16570381f1022b27cd760ad9fcf675c485'
          test "$(sha256sum "$authority_dir/REPOSITORY_SOURCE_MANIFEST.tsv" | awk '{print $1}')" = '1ec9c43c432267c2cbfe6a0740978f401170b146db6ad0dc019755ce5a19217a'
          test "$(sha256sum "$authority_dir/REGRESSIONS.txt" | awk '{print $1}')" = 'c0cafba33deb4d56865408adbcb6c31c6a53e7b13dba55db6ce9648b52fb4e3b'
          test "$(cat "$authority_dir/SOURCE_COMMIT.txt")" = "$authority"

          rm -rf "$authority_src" "$canonical"
          mkdir -p "$authority_src" "$canonical"
          tar -xf "$authority_dir/Iris-HDR-Viewfinder-Test-V1.5.4-source-candidate.tar" -C "$authority_src"

          python3 - "$authority_src" "$authority_dir" <<'PYAUTH'
          from pathlib import Path
          import hashlib, sys
          src=Path(sys.argv[1]); artifact=Path(sys.argv[2])
          def row(p,rel):
              b=p.read_bytes(); lines=b.count(b'\n')+(1 if b and not b.endswith(b'\n') else 0)
              return f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{rel}\n"
          runtime=sorted(p for p in (src/'app/src').rglob('*') if p.is_file())
          if len(runtime)!=16: raise SystemExit(f'V1.5.4 AUTHORITY RUNTIME COUNT FAIL: {len(runtime)}')
          rb=''.join(row(p,p.relative_to(src).as_posix()) for p in runtime).encode()
          if hashlib.sha256(rb).hexdigest()!='eafb637ae41d304e75afc4376957ec16570381f1022b27cd760ad9fcf675c485': raise SystemExit('V1.5.4 AUTHORITY RUNTIME DIGEST FAIL')
          if rb!=(artifact/'RUNTIME_SOURCE_MANIFEST.tsv').read_bytes(): raise SystemExit('V1.5.4 AUTHORITY RUNTIME MANIFEST BYTE FAIL')
          tracked=sorted(p for p in src.rglob('*') if p.is_file())
          if len(tracked)!=29: raise SystemExit(f'V1.5.4 AUTHORITY REPOSITORY COUNT FAIL: {len(tracked)}')
          repo=''.join(row(p,p.relative_to(src).as_posix()) for p in tracked).encode()
          if hashlib.sha256(repo).hexdigest()!='1ec9c43c432267c2cbfe6a0740978f401170b146db6ad0dc019755ce5a19217a': raise SystemExit('V1.5.4 AUTHORITY REPOSITORY DIGEST FAIL')
          if repo!=(artifact/'REPOSITORY_SOURCE_MANIFEST.tsv').read_bytes(): raise SystemExit('V1.5.4 AUTHORITY REPOSITORY MANIFEST BYTE FAIL')
          print('EXACT V1.5.4 ACTIONS ARTIFACT AUTHORITY: PASS')
          PYAUTH

          python3 - "$authority" "$authority_src" "$canonical" <<'PYCAND'
          from pathlib import Path
          import hashlib, shutil, subprocess, sys
          authority, authority_src, canonical = sys.argv[1], Path(sys.argv[2]), Path(sys.argv[3])
          expected={
            '.github/workflows/build.yml':'M','BUILD_WORKFLOW_COPY.yml':'M','PACKAGE_INFO.txt':'M','PACKAGE_MANIFEST_SHA256.txt':'M','README.md':'M','VSCODE_DEV_UPLOAD.txt':'M',
            'app/build.gradle.kts':'M',
            'app/src/main/assets/shaders/raw_hdr_demosaic.frag':'M','app/src/main/assets/shaders/raw_hdr_fusion.frag':'M',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/RawHdrFusion.java':'M',
            'scripts/verify_orientation.py':'M'}
          raw=subprocess.check_output(['git','diff','--name-status',authority,'HEAD'],text=True).splitlines()
          actual={}
          for line in raw:
              parts=line.split('\t'); actual[parts[-1]]=parts[0][0]
          if actual!=expected: raise SystemExit(f'V1.5.4 V1.1 EXACT CHANGED-FILE ALLOWLIST FAIL: actual={actual} expected={expected}')
          runtime_expected={k:v for k,v in expected.items() if k.startswith('app/src/')}
          raw=subprocess.check_output(['git','diff','--name-status',authority,'HEAD','--','app/src'],text=True).splitlines()
          runtime_actual={}
          for line in raw:
              parts=line.split('\t'); runtime_actual[parts[-1]]=parts[0][0]
          if runtime_actual!=runtime_expected: raise SystemExit(f'V1.5.4 V1.1 RUNTIME ALLOWLIST FAIL: {runtime_actual}')
          shutil.copytree(authority_src,canonical,dirs_exist_ok=True)
          for rel in expected:
              src=Path(rel); dst=canonical/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          candidate_paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          canonical_paths=sorted(p.relative_to(canonical).as_posix() for p in canonical.rglob('*') if p.is_file())
          if len(candidate_paths)!=29 or candidate_paths!=canonical_paths: raise SystemExit(f'AUTHORITY-SEEDED CANONICAL PATH SET FAIL candidate={len(candidate_paths)} canonical={len(canonical_paths)}')
          for rel in candidate_paths:
              if Path(rel).read_bytes()!=(canonical/rel).read_bytes(): raise SystemExit(f'AUTHORITY-SEEDED CANONICAL BYTE FAIL: {rel}')
          protected={
            'app/src/main/AndroidManifest.xml':'c183cb4caf4c9c8aa40a41d3891c197d9e84db196c6ecccd822b1c424ebc73e6',
            'app/src/main/assets/shaders/copy_2d.frag':'b6b890e3be034a0d4980fd324fe0f469c7a2b0a126e958607bc8c4b9fbf97a55',
            'app/src/main/assets/shaders/flicker_field.frag':'49f72d30423395e00863ad9a510c414a15e67a1a2247f76aca22b4a41171f695',
            'app/src/main/assets/shaders/fullscreen.vert':'7d8ee58c4500a46dd9614404a17ea4c7e104a6bf43976ecb85795799fdcd7fb4',
            'app/src/main/assets/shaders/hdr_display.frag':'45483186243cffb220c00a23e4de78396a2d482168452cec22238da79eb1dcb8',
            'app/src/main/assets/shaders/oes_to_rgb.frag':'388d49929564efba24900794e035f88b461485f4da4f2e12caf71e3531ab6443',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java':'a87d34672d7e4efb16d5cd84c84fb82cc4a4abd567f74d012f1f665eb679ac37',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java':'cbd76d5a21cddd1ac3e48ad57896ef50d7770f6415d10749df2cb9f82650f1e4',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java':'b565eea5d43d68d84a2984202df492297eb8fb4f68566d4b5a409dde8818e33e',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java':'3377d4f3ebac7a46cfb5887ca4592174ea6586e7d84a46af390bed6302a6f9fe',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java':'a5206949d9c09fd45ee0f3b7ec3b0787c10f037b8447db249ead6df19aed91ed',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java':'87d58462eb3822b2135f423be9ba12c6d61f87d3d9fb091ddde3b0a2ed3a9178',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java':'a975fb65529c864a8bcefcded6c5df68fa881e7f97040734c6b0e326d27cc110'}
          for rel,want in protected.items():
              got=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f'V1.5.4 V1.1 PROTECTED BYTE FAIL: {rel} {got}')
          print('AUTHORITY-SEEDED CANONICAL CANDIDATE + PROTECTED INVARIANCE: PASS')
          PYCAND

          python3 scripts/verify_orientation.py
          python3 scripts/verify_shaders.py
          if grep -RFn 'readAllBytes(' app/src/main/java; then echo 'REGRESSION FAIL 003: API-33 readAllBytes returned' >&2; exit 1; fi
          if find app/build app/.cxx -type f -print 2>/dev/null | grep -q .; then echo 'PRECOMPILER GENERATED-DIR CONTAMINATION FAIL' >&2; exit 1; fi
          echo 'V1.5.4 V1.1 PRE-COMPILER AUTHORITY/SEMANTIC PROOF: PASS'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and prove Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > "$RUNNER_TEMP/sdkmanager-list.txt"
          grep -Fq 'platforms;android-37.0' "$RUNNER_TEMP/sdkmanager-list.txt"
          sdkmanager "platforms;android-37.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare stable V1.5.4 V1.1 test signing identity
        shell: bash
        env:
          IRIS_TEST_SIGNING_KEY_B64: ${{ secrets.IRIS_TEST_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "${IRIS_TEST_SIGNING_KEY_B64:-}" || { echo 'Missing required Actions secret IRIS_TEST_SIGNING_KEY_B64' >&2; exit 1; }
          key="$RUNNER_TEMP/iris-hdr-test-signing.p12"
          printf '%s' "$IRIS_TEST_SIGNING_KEY_B64" | base64 -d > "$key"
          test "$(sha256sum "$key" | awk '{print $1}')" = '2a4ec2ab3fed7ae4d2e9c1b6b80c3b5bb19f07420952e97c203fda31e69cff2e'
          fingerprint="$(keytool -list -v -storetype PKCS12 -keystore "$key" -storepass IrisHdrTest2026 -alias iris-hdr-test | awk -F'SHA256: ' '/SHA256:/{gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2; exit}')"
          test "$fingerprint" = '53:1A:EE:D9:EA:D7:9D:28:C4:24:AD:8F:71:A4:59:B4:CE:D8:AF:F3:7E:95:C1:1B:D2:95:08:3F:BB:25:C4:E8'
          echo "IRIS_TEST_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
          printf '%s\n' '2a4ec2ab3fed7ae4d2e9c1b6b80c3b5bb19f07420952e97c203fda31e69cff2e' > "$RUNNER_TEMP/SIGNING_KEY_SHA256.txt"
          printf '%s\n' "$fingerprint" > "$RUNNER_TEMP/SIGNING_CERT_SHA256.txt"

      - name: Install pinned real GLSL compiler
        shell: bash
        run: |
          set -euo pipefail
          expected='15.1.0-2~ubuntu0.24.04.2'
          sudo apt-get update
          sudo apt-get install -y "glslang-tools=$expected"
          test "$(dpkg-query -W -f='${Version}' glslang-tools)" = "$expected"
          glslangValidator --version

      - name: Scan complete GLSL reserved identifiers
        shell: bash
        run: python3 scripts/verify_shaders.py

      - name: Compile exact runtime GLSL assets
        shell: bash
        run: |
          set -euo pipefail
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/oes_to_rgb.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/copy_2d.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/flicker_field.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/hdr_display.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/raw_hdr_fusion.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/raw_hdr_demosaic.frag

      - name: Compile modified Java with real project compiler
        shell: bash
        run: gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac

      - name: Deterministic patch proof regressions and PRE-BUILD SAFETY PROOF
        shell: bash
        run: |
          set -euo pipefail
          authority='b352a4f12f011496f8c0eeb3a51553b35cc33c48'
          authority_src="$RUNNER_TEMP/v154-authority-source"
          python3 scripts/verify_orientation.py
          python3 scripts/verify_shaders.py
          for n in 7 12 40; do
            git -c core.abbrev="$n" diff --binary --full-index --no-ext-diff "$authority" HEAD > "$RUNNER_TEMP/V1.5.4_to_V1.5.4-V1.1.forward.abbrev${n}.patch"
            git -c core.abbrev="$n" diff --binary --full-index --no-ext-diff HEAD "$authority" > "$RUNNER_TEMP/V1.5.4-V1.1_to_V1.5.4.rollback.abbrev${n}.patch"
          done
          cmp "$RUNNER_TEMP/V1.5.4_to_V1.5.4-V1.1.forward.abbrev7.patch" "$RUNNER_TEMP/V1.5.4_to_V1.5.4-V1.1.forward.abbrev12.patch"
          cmp "$RUNNER_TEMP/V1.5.4_to_V1.5.4-V1.1.forward.abbrev7.patch" "$RUNNER_TEMP/V1.5.4_to_V1.5.4-V1.1.forward.abbrev40.patch"
          cmp "$RUNNER_TEMP/V1.5.4-V1.1_to_V1.5.4.rollback.abbrev7.patch" "$RUNNER_TEMP/V1.5.4-V1.1_to_V1.5.4.rollback.abbrev12.patch"
          cmp "$RUNNER_TEMP/V1.5.4-V1.1_to_V1.5.4.rollback.abbrev7.patch" "$RUNNER_TEMP/V1.5.4-V1.1_to_V1.5.4.rollback.abbrev40.patch"
          cp "$RUNNER_TEMP/V1.5.4_to_V1.5.4-V1.1.forward.abbrev40.patch" "$RUNNER_TEMP/V1.5.4_to_V1.5.4-V1.1.forward.patch"
          cp "$RUNNER_TEMP/V1.5.4-V1.1_to_V1.5.4.rollback.abbrev40.patch" "$RUNNER_TEMP/V1.5.4-V1.1_to_V1.5.4.rollback.patch"
          python3 - "$authority_src" "$RUNNER_TEMP/V1.5.4_to_V1.5.4-V1.1.forward.patch" "$RUNNER_TEMP/V1.5.4-V1.1_to_V1.5.4.rollback.patch" <<'PYPATCH'
          from pathlib import Path
          import shutil, subprocess, sys, tempfile
          authority, forward, rollback=map(Path,sys.argv[1:])
          authority_paths=sorted(p.relative_to(authority).as_posix() for p in authority.rglob('*') if p.is_file())
          candidate_paths=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          def state(root,expected,label):
              paths=sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
              if paths!=expected: raise SystemExit(f'{label} PATH SET FAIL')
              for rel in expected:
                  ref=Path(rel).read_bytes() if expected is candidate_paths else (authority/rel).read_bytes()
                  if (root/rel).read_bytes()!=ref: raise SystemExit(f'{label} BYTE FAIL: {rel}')
          with tempfile.TemporaryDirectory() as td:
              t=Path(td); g=t/'git'; shutil.copytree(authority,g)
              subprocess.run(['git','apply',str(forward)],cwd=g,check=True); state(g,candidate_paths,'GIT FORWARD')
              subprocess.run(['git','apply',str(rollback)],cwd=g,check=True); state(g,authority_paths,'GIT ROLLBACK')
              p=t/'patch'; shutil.copytree(authority,p)
              subprocess.run(['patch','-p1','--fuzz=0','-i',str(forward)],cwd=p,check=True,stdout=subprocess.DEVNULL); state(p,candidate_paths,'GNU FORWARD')
              subprocess.run(['patch','-p1','--fuzz=0','-i',str(rollback)],cwd=p,check=True,stdout=subprocess.DEVNULL); state(p,authority_paths,'GNU ROLLBACK')
          print('DETERMINISTIC FULL-INDEX FORWARD/ROLLBACK PATCH PROOF: PASS')
          PYPATCH
          sha256sum "$RUNNER_TEMP/V1.5.4_to_V1.5.4-V1.1.forward.patch" | awk '{print $1}' > "$RUNNER_TEMP/FORWARD_PATCH_SHA256.txt"
          sha256sum "$RUNNER_TEMP/V1.5.4-V1.1_to_V1.5.4.rollback.patch" | awk '{print $1}' > "$RUNNER_TEMP/ROLLBACK_PATCH_SHA256.txt"
          git diff --exit-code -- .
          cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml
          sha256sum -c PACKAGE_MANIFEST_SHA256.txt
          echo 'PRE-BUILD SAFETY PROOF PASSED'

      - name: Build full debug APK from frozen compiler-tested candidate
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Post-build invariance clean-extract replay and final candidate export
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          python3 scripts/verify_orientation.py
          python3 scripts/verify_shaders.py
          sha256sum -c PACKAGE_MANIFEST_SHA256.txt
          cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml

          python3 - <<'PYPOST'
          from pathlib import Path
          import hashlib, subprocess
          expected_runtime='505eaeb9384a62cf24e000a4ff06f3ab36f535fcda2bbd61807376c17e99899f'
          files=sorted(p for p in Path('app/src').rglob('*') if p.is_file())
          rows=[]
          for p in files:
              b=p.read_bytes(); lines=b.count(b'\n')+(1 if b and not b.endswith(b'\n') else 0)
              rows.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{p.as_posix()}\n")
          manifest=''.join(rows).encode(); digest=hashlib.sha256(manifest).hexdigest()
          if len(files)!=16 or digest!=expected_runtime: raise SystemExit(f'POST-BUILD RUNTIME INVARIANCE FAIL count={len(files)} digest={digest}')
          Path('compiled-runtime-manifest.tsv').write_bytes(manifest)
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          if len(tracked)!=29: raise SystemExit(f'POST-BUILD TRACKED COUNT FAIL: {len(tracked)}')
          repo=[]
          for rel in tracked:
              b=Path(rel).read_bytes(); lines=b.count(b'\n')+(1 if b and not b.endswith(b'\n') else 0)
              repo.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{rel}\n")
          Path('compiled-repository-manifest.tsv').write_text(''.join(repo))
          protected={
            'app/src/main/AndroidManifest.xml':'c183cb4caf4c9c8aa40a41d3891c197d9e84db196c6ecccd822b1c424ebc73e6',
            'app/src/main/assets/shaders/copy_2d.frag':'b6b890e3be034a0d4980fd324fe0f469c7a2b0a126e958607bc8c4b9fbf97a55',
            'app/src/main/assets/shaders/flicker_field.frag':'49f72d30423395e00863ad9a510c414a15e67a1a2247f76aca22b4a41171f695',
            'app/src/main/assets/shaders/fullscreen.vert':'7d8ee58c4500a46dd9614404a17ea4c7e104a6bf43976ecb85795799fdcd7fb4',
            'app/src/main/assets/shaders/hdr_display.frag':'45483186243cffb220c00a23e4de78396a2d482168452cec22238da79eb1dcb8',
            'app/src/main/assets/shaders/oes_to_rgb.frag':'388d49929564efba24900794e035f88b461485f4da4f2e12caf71e3531ab6443',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java':'a87d34672d7e4efb16d5cd84c84fb82cc4a4abd567f74d012f1f665eb679ac37',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java':'cbd76d5a21cddd1ac3e48ad57896ef50d7770f6415d10749df2cb9f82650f1e4',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java':'b565eea5d43d68d84a2984202df492297eb8fb4f68566d4b5a409dde8818e33e',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java':'3377d4f3ebac7a46cfb5887ca4592174ea6586e7d84a46af390bed6302a6f9fe',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java':'a5206949d9c09fd45ee0f3b7ec3b0787c10f037b8447db249ead6df19aed91ed',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java':'87d58462eb3822b2135f423be9ba12c6d61f87d3d9fb091ddde3b0a2ed3a9178',
            'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java':'a975fb65529c864a8bcefcded6c5df68fa881e7f97040734c6b0e326d27cc110'}
