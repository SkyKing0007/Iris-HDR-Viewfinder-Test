name: Build Iris HDR Viewfinder Test V1.4.23

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - 'BUILD_WORKFLOW_COPY.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Download exact successful V1.4.22 Actions authority artifact
        uses: actions/download-artifact@v4
        with:
          name: Iris-HDR-Viewfinder-Test-V1.4.22
          path: ${{ runner.temp }}/v1422-authority-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33586520503

      - name: Reconstruct exact V1.4.22 authority and prove candidate before compilers
        shell: bash
        run: |
          set -euo pipefail
          authority='3042459e1308006c09f0236ddf23751222cadd59'
          authority_tree='b68d92875125a17982c046f8f4ea4476450d1207'
          failed_candidate='6b47d9fd790f285df7309ce8bef3a3b3e834701d'
          failed_candidate_tree='58e76dd0641bc9e0c510562ebc62e9193cc31f68'
          authority_dir="$RUNNER_TEMP/v1422-authority-artifact"
          authority_src="$RUNNER_TEMP/v1422-authority-source"

          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = 'main'
          test "$(git rev-parse HEAD^)" = "$failed_candidate"
          test "$(git rev-parse "$failed_candidate^{tree}")" = "$failed_candidate_tree"
          test "$(git rev-parse HEAD^^)" = "$authority"
          test "$(git rev-parse "$authority^{tree}")" = "$authority_tree"
          cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml
          python3 - "$failed_candidate" <<'PY'
          import subprocess, sys
          failed = sys.argv[1]
          expected = {
              '.github/workflows/build.yml': 'M',
              'BUILD_WORKFLOW_COPY.yml': 'M',
              'PACKAGE_MANIFEST_SHA256.txt': 'M',
          }
          raw = subprocess.check_output(['git', 'diff', '--name-status', failed, 'HEAD'], text=True).splitlines()
          actual = {}
          for line in raw:
              parts = line.split('\t')
              actual[parts[-1]] = parts[0][0]
          if actual != expected:
              raise SystemExit(f'V1.4.23 V1.1 CORRECTION ALLOWLIST FAIL: actual={actual} expected={expected}')
          runtime = subprocess.check_output(['git', 'diff', '--name-only', failed, 'HEAD', '--', 'app/src'], text=True).strip()
          if runtime:
              raise SystemExit(f'V1.4.23 V1.1 RUNTIME INVARIANCE FAIL: {runtime}')
          print('V1.4.23 V1.1 INFRASTRUCTURE-ONLY CORRECTION: PASS')
          PY
          grep -Fq 'versionCode = 28' app/build.gradle.kts
          grep -Fq 'versionName = "1.0-v1.4.23"' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'minSdk = 29' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          grep -Fq 'version "9.2.1"' build.gradle.kts
          sha256sum -c PACKAGE_MANIFEST_SHA256.txt

          test "$(sha256sum "$authority_dir/Iris-HDR-Viewfinder-Test-V1.4.22-debug.apk" | awk '{print $1}')" = '12888fd84c8093c177d46952316c9827bad5fff408c597ff5fe12054be28dcc4'
          test "$(sha256sum "$authority_dir/Iris-HDR-Viewfinder-Test-V1.4.22-source-candidate.tar" | awk '{print $1}')" = '2ffaff7142ef0fc62ee49d7db8fca9d2ac2e46e3f447f6e01543c9e60b5932db'
          test "$(sha256sum "$authority_dir/RUNTIME_SOURCE_MANIFEST.tsv" | awk '{print $1}')" = 'e003754dae13f51de722e6a4867ed11911ff49ae4ab87cf807e293d7a78f52c6'
          test "$(sha256sum "$authority_dir/REPOSITORY_SOURCE_MANIFEST.tsv" | awk '{print $1}')" = 'db7aed1fbf3eed9997ca518843743bba23d162afe31b696be8ec1207e6c719b2'
          test "$(sha256sum "$authority_dir/REGRESSIONS.txt" | awk '{print $1}')" = '97cec692954e4c21098747e7c6575cb01149a7a220b54b796169afa9248cae64'
          test "$(cat "$authority_dir/SOURCE_COMMIT.txt")" = "$authority"

          rm -rf "$authority_src"
          mkdir -p "$authority_src"
          tar -xf "$authority_dir/Iris-HDR-Viewfinder-Test-V1.4.22-source-candidate.tar" -C "$authority_src"

          python3 - "$authority_src" "$authority_dir" <<'PY'
          from pathlib import Path
          import hashlib, subprocess, sys, tempfile

          src = Path(sys.argv[1])
          artifact = Path(sys.argv[2])
          expected_runtime_sha = 'e003754dae13f51de722e6a4867ed11911ff49ae4ab87cf807e293d7a78f52c6'
          expected_repo_sha = 'db7aed1fbf3eed9997ca518843743bba23d162afe31b696be8ec1207e6c719b2'

          def row(p, rel):
              b = p.read_bytes()
              lines = b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              return f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{rel}\n"

          runtime_files = sorted(p for p in (src / 'app/src').rglob('*') if p.is_file())
          if len(runtime_files) != 12:
              raise SystemExit(f'V1.4.22 AUTHORITY RUNTIME COUNT FAIL: {len(runtime_files)}')
          runtime = ''.join(row(p, p.relative_to(src).as_posix()) for p in runtime_files).encode()
          if hashlib.sha256(runtime).hexdigest() != expected_runtime_sha:
              raise SystemExit('V1.4.22 AUTHORITY RUNTIME MANIFEST SHA FAIL')
          if runtime != (artifact / 'RUNTIME_SOURCE_MANIFEST.tsv').read_bytes():
              raise SystemExit('V1.4.22 AUTHORITY RUNTIME MANIFEST BYTE-EQUALITY FAIL')

          tracked = sorted(p for p in src.rglob('*') if p.is_file())
          if len(tracked) != 25:
              raise SystemExit(f'V1.4.22 AUTHORITY REPOSITORY COUNT FAIL: {len(tracked)}')
          repo = ''.join(row(p, p.relative_to(src).as_posix()) for p in tracked).encode()
          if hashlib.sha256(repo).hexdigest() != expected_repo_sha:
              raise SystemExit('V1.4.22 AUTHORITY REPOSITORY MANIFEST SHA FAIL')
          if repo != (artifact / 'REPOSITORY_SOURCE_MANIFEST.tsv').read_bytes():
              raise SystemExit('V1.4.22 AUTHORITY REPOSITORY MANIFEST BYTE-EQUALITY FAIL')

          with tempfile.TemporaryDirectory() as td:
              tar_path = Path(td) / 'authority.tar'
              subprocess.run(['git', 'archive', '--format=tar', f'--output={tar_path}', '3042459e1308006c09f0236ddf23751222cadd59'], check=True)
              checkout = Path(td) / 'git-archive'
              checkout.mkdir()
              subprocess.run(['tar', '-xf', str(tar_path), '-C', str(checkout)], check=True)
              git_files = sorted(p for p in checkout.rglob('*') if p.is_file())
              if [p.relative_to(checkout).as_posix() for p in git_files] != [p.relative_to(src).as_posix() for p in tracked]:
                  raise SystemExit('V1.4.22 AUTHORITY ARTIFACT/GIT PATH SET FAIL')
              for gp, ap in zip(git_files, tracked):
                  if gp.read_bytes() != ap.read_bytes():
                      raise SystemExit(f'V1.4.22 AUTHORITY ARTIFACT/GIT BYTE FAIL: {gp.relative_to(checkout)}')
          print('EXACT V1.4.22 ACTIONS ARTIFACT AUTHORITY: PASS')
          PY

          bad_platform='platforms;android-37'
          if grep -Fq "sdkmanager \"$bad_platform\"" .github/workflows/build.yml; then
            echo 'REGRESSION FAIL 001: invalid API 37 package identifier survived' >&2
            exit 1
          fi
          if grep -RFn 'readAllBytes(' app/src/main/java; then
            echo 'REGRESSION FAIL 003: API-33 InputStream.readAllBytes survived minSdk 29 source' >&2
            exit 1
          fi
          if grep -RFn 'meta.timestampNs' app/src/main/java; then
            echo 'REGRESSION FAIL 015: failed V1.4 FrameMeta timestamp field reference returned' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          authority = '3042459e1308006c09f0236ddf23751222cadd59'
          expected_changes = {
              '.github/workflows/build.yml': 'M',
              'BUILD_WORKFLOW_COPY.yml': 'M',
              'PACKAGE_INFO.txt': 'M',
              'PACKAGE_MANIFEST_SHA256.txt': 'M',
              'README.md': 'M',
              'VSCODE_DEV_UPLOAD.txt': 'M',
              'app/build.gradle.kts': 'M',
              'app/src/main/assets/shaders/flicker_field.frag': 'A',
              'app/src/main/assets/shaders/hdr_display.frag': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java': 'M',
              'scripts/verify_orientation.py': 'M',
          }
          raw = subprocess.check_output(['git', 'diff', '--name-status', authority, 'HEAD'], text=True).splitlines()
          actual = {}
          for line in raw:
              parts = line.split('\t')
              actual[parts[-1]] = parts[0][0]
          if actual != expected_changes:
              raise SystemExit(f'V1.4.23 ALLOWLIST FAIL: actual={actual} expected={expected_changes}')

          expected_tracked = [
              '.github/workflows/build.yml', '.gitignore', 'BUILD_WORKFLOW_COPY.yml',
              'PACKAGE_INFO.txt', 'PACKAGE_MANIFEST_SHA256.txt', 'README.md', 'VSCODE_DEV_UPLOAD.txt',
              'app/build.gradle.kts', 'app/src/main/AndroidManifest.xml',
              'app/src/main/assets/shaders/copy_2d.frag',
              'app/src/main/assets/shaders/flicker_field.frag',
              'app/src/main/assets/shaders/fullscreen.vert',
              'app/src/main/assets/shaders/hdr_display.frag',
              'app/src/main/assets/shaders/oes_to_rgb.frag',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java',
              'build.gradle.kts', 'gradle.properties', 'scripts/verify_orientation.py',
              'scripts/verify_shaders.py', 'settings.gradle.kts',
          ]
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          if tracked != expected_tracked:
              raise SystemExit(f'REGRESSION FAIL 002: tracked mismatch actual={tracked}')

          files = sorted(p for p in Path('app/src').rglob('*') if p.is_file())
          if len(files) != 13:
              raise SystemExit(f'V1.4.23 RUNTIME FILE COUNT FAIL: {len(files)}')
          rows=[]
          for p in files:
              b=p.read_bytes(); lines=b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              rows.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{p.as_posix()}\n")
          manifest=''.join(rows).encode()
          digest=hashlib.sha256(manifest).hexdigest()
          expected='d41f3f66060d91f5be4a579c9ead2b8a11f5efaf9f71f18de11700b846255350'
          if digest != expected:
              raise SystemExit(f'V1.4.23 RUNTIME MANIFEST FAIL: {digest} != {expected}')
          Path('bootstrap-runtime-manifest.tsv').write_bytes(manifest)

          protected = {
              'app/src/main/AndroidManifest.xml': 'c183cb4caf4c9c8aa40a41d3891c197d9e84db196c6ecccd822b1c424ebc73e6',
              'app/src/main/assets/shaders/copy_2d.frag': 'b6b890e3be034a0d4980fd324fe0f469c7a2b0a126e958607bc8c4b9fbf97a55',
              'app/src/main/assets/shaders/fullscreen.vert': '7d8ee58c4500a46dd9614404a17ea4c7e104a6bf43976ecb85795799fdcd7fb4',
              'app/src/main/assets/shaders/oes_to_rgb.frag': '388d49929564efba24900794e035f88b461485f4da4f2e12caf71e3531ab6443',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java': 'f0019a77d75f78cdaff1bc1b898f916788504a5917062838d527240d17ef4357',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java': 'a975fb65529c864a8bcefcded6c5df68fa881e7f97040734c6b0e326d27cc110',
          }
          for rel, sha in protected.items():
              got=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if got != sha:
                  raise SystemExit(f'V1.4.23 PROTECTED RUNTIME FAIL: {rel} {got} != {sha}')
          print(f'V1.4.23 MINIMUM CANDIDATE PASS: changed={len(actual)} runtime=13 digest={digest} protected={len(protected)}/{len(protected)}')
          PY

          patch_sha=''
          rollback_sha=''
          for abbrev in 7 12 40; do
            git -c core.abbrev="$abbrev" diff --binary --full-index "$authority" HEAD > "$RUNNER_TEMP/forward-$abbrev.patch"
            git -c core.abbrev="$abbrev" diff --binary --full-index HEAD "$authority" > "$RUNNER_TEMP/rollback-$abbrev.patch"
            if test -z "$patch_sha"; then
              patch_sha="$(sha256sum "$RUNNER_TEMP/forward-$abbrev.patch" | awk '{print $1}')"
              rollback_sha="$(sha256sum "$RUNNER_TEMP/rollback-$abbrev.patch" | awk '{print $1}')"
            else
              test "$(sha256sum "$RUNNER_TEMP/forward-$abbrev.patch" | awk '{print $1}')" = "$patch_sha"
              test "$(sha256sum "$RUNNER_TEMP/rollback-$abbrev.patch" | awk '{print $1}')" = "$rollback_sha"
            fi
          done
          cmp -s "$RUNNER_TEMP/forward-7.patch" "$RUNNER_TEMP/forward-12.patch"
          cmp -s "$RUNNER_TEMP/forward-7.patch" "$RUNNER_TEMP/forward-40.patch"
          cmp -s "$RUNNER_TEMP/rollback-7.patch" "$RUNNER_TEMP/rollback-12.patch"
          cmp -s "$RUNNER_TEMP/rollback-7.patch" "$RUNNER_TEMP/rollback-40.patch"
          cp "$RUNNER_TEMP/forward-7.patch" "$RUNNER_TEMP/V1.4.22_to_V1.4.23.forward.patch"
          cp "$RUNNER_TEMP/rollback-7.patch" "$RUNNER_TEMP/V1.4.23_to_V1.4.22.rollback.patch"

          python3 - "$authority_src" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/V1.4.22_to_V1.4.23.forward.patch" "$RUNNER_TEMP/V1.4.23_to_V1.4.22.rollback.patch" <<'PY'
          from pathlib import Path
          import shutil, subprocess, sys, tempfile
          authority, candidate, forward, rollback = map(Path, sys.argv[1:])
          candidate_paths = subprocess.check_output(
              ['git', '-C', str(candidate), 'ls-files'], text=True).splitlines()
          authority_paths = sorted(
              p.relative_to(authority).as_posix() for p in authority.rglob('*') if p.is_file())

          if len(candidate_paths) != 26 or len(authority_paths) != 25:
              raise SystemExit(
                  f'PATCH PATH-UNIVERSE SETUP FAIL: candidate={len(candidate_paths)} authority={len(authority_paths)}')
          added = sorted(set(candidate_paths) - set(authority_paths))
          removed = sorted(set(authority_paths) - set(candidate_paths))
          if added != ['app/src/main/assets/shaders/flicker_field.frag'] or removed:
              raise SystemExit(f'PATCH A/D UNIVERSE FAIL: added={added} removed={removed}')

          def actual_paths(root):
              return sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())

          def compare_state(left, right, expected_paths, label):
              paths = actual_paths(left)
              if paths != expected_paths:
                  missing = sorted(set(expected_paths) - set(paths))
                  extra = sorted(set(paths) - set(expected_paths))
                  raise SystemExit(f'{label} PATH SET FAIL: missing={missing} extra={extra}')
              for rel in expected_paths:
                  a=(left/rel).read_bytes(); b=(right/rel).read_bytes()
                  if a != b:
                      raise SystemExit(f'{label} BYTE FAIL: {rel}')

          with tempfile.TemporaryDirectory() as td:
              t=Path(td)
              g=t/'git-apply'; shutil.copytree(authority, g)
              subprocess.run(['git','apply',str(forward)],cwd=g,check=True)
              compare_state(g,candidate,candidate_paths,'GIT FORWARD')
              subprocess.run(['git','apply',str(rollback)],cwd=g,check=True)
              compare_state(g,authority,authority_paths,'GIT ROLLBACK')

              p=t/'gnu-patch'; shutil.copytree(authority,p)
              subprocess.run(['patch','-p1','--fuzz=0','-i',str(forward)],cwd=p,check=True)
              compare_state(p,candidate,candidate_paths,'GNU FUZZ0 FORWARD')
              subprocess.run(['patch','-p1','--fuzz=0','-i',str(rollback)],cwd=p,check=True)
              compare_state(p,authority,authority_paths,'GNU FUZZ0 ROLLBACK')
          print('FORWARD/ROLLBACK PATCH REPLAY WITH A/D PATH-SET PROOF: PASS')
          PY
          printf '%s\n' "$patch_sha" > "$RUNNER_TEMP/FORWARD_PATCH_SHA256.txt"
          printf '%s\n' "$rollback_sha" > "$RUNNER_TEMP/ROLLBACK_PATCH_SHA256.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and prove Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > "$RUNNER_TEMP/sdkmanager-list.txt"
          grep -Fq 'platforms;android-37.0' "$RUNNER_TEMP/sdkmanager-list.txt"
          sdkmanager "platforms;android-37.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare stable V1.4.23 test signing identity
        shell: bash
        env:
          IRIS_TEST_SIGNING_KEY_B64: ${{ secrets.IRIS_TEST_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "${IRIS_TEST_SIGNING_KEY_B64:-}" || { echo 'Missing required Actions secret IRIS_TEST_SIGNING_KEY_B64' >&2; exit 1; }
          key="$RUNNER_TEMP/iris-hdr-test-signing.p12"
          printf '%s' "$IRIS_TEST_SIGNING_KEY_B64" | base64 -d > "$key"
          test "$(sha256sum "$key" | awk '{print $1}')" = '2a4ec2ab3fed7ae4d2e9c1b6b80c3b5bb19f07420952e97c203fda31e69cff2e'
          fingerprint="$(keytool -list -v -storetype PKCS12 -keystore "$key" -storepass IrisHdrTest2026 -alias iris-hdr-test | awk -F'SHA256: ' '/SHA256:/{gsub(/^[ \t]+|[ \t]+$/,"",$2); print $2; exit}')"
          test "$fingerprint" = '53:1A:EE:D9:EA:D7:9D:28:C4:24:AD:8F:71:A4:59:B4:CE:D8:AF:F3:7E:95:C1:1B:D2:95:08:3F:BB:25:C4:E8'
          echo "IRIS_TEST_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
          printf '%s\n' '2a4ec2ab3fed7ae4d2e9c1b6b80c3b5bb19f07420952e97c203fda31e69cff2e' > "$RUNNER_TEMP/SIGNING_KEY_SHA256.txt"
          printf '%s\n' "$fingerprint" > "$RUNNER_TEMP/SIGNING_CERT_SHA256.txt"

      - name: Install pinned real GLSL compiler
        shell: bash
        run: |
          set -euo pipefail
          expected='15.1.0-2~ubuntu0.24.04.2'
          sudo apt-get update
          sudo apt-get install -y "glslang-tools=$expected"
          test "$(dpkg-query -W -f='${Version}' glslang-tools)" = "$expected"
          glslangValidator --version

      - name: Scan complete GLSL reserved identifiers
        shell: bash
        run: python3 scripts/verify_shaders.py

      - name: Compile exact runtime GLSL assets
        shell: bash
        run: |
          set -euo pipefail
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/oes_to_rgb.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/copy_2d.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/flicker_field.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/hdr_display.frag

      - name: Compile modified Java with real project compiler
        shell: bash
        run: gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac

      - name: Replay V1.4.23 runtime regressions on compiler-tested candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_orientation.py
          python3 scripts/verify_shaders.py

      - name: Build full debug APK from frozen compiler-tested candidate
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Post-build invariance and freeze compiled V1.4.23 candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          python3 scripts/verify_orientation.py
          python3 scripts/verify_shaders.py
          sha256sum -c PACKAGE_MANIFEST_SHA256.txt
          cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          expected_runtime='d41f3f66060d91f5be4a579c9ead2b8a11f5efaf9f71f18de11700b846255350'
          files=sorted(p for p in Path('app/src').rglob('*') if p.is_file())
          rows=[]
          for p in files:
              b=p.read_bytes(); lines=b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              rows.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{p.as_posix()}\n")
          manifest=''.join(rows).encode(); digest=hashlib.sha256(manifest).hexdigest()
          if len(files)!=13 or digest!=expected_runtime:
              raise SystemExit(f'POST-BUILD RUNTIME INVARIANCE FAIL files={len(files)} digest={digest}')
          Path('compiled-runtime-manifest.tsv').write_bytes(manifest)
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          if len(tracked) != 26:
              raise SystemExit(f'POST-BUILD TRACKED COUNT FAIL: {len(tracked)}')
          repo=[]
          for rel in tracked:
              b=Path(rel).read_bytes(); lines=b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              repo.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{rel}\n")
          Path('compiled-repository-manifest.tsv').write_text(''.join(repo))
          protected = {
