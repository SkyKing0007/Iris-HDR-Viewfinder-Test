name: Build Iris HDR Viewfinder Test V1.4.11 V2.26

on:
  workflow_dispatch:
  push:
    branches: [ experiment-v1.4.11-v2-brightness-4ev ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - 'BUILD_WORKFLOW_COPY.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Download exact successful V1.4.11 V2.25 Actions authority artifact
        uses: actions/download-artifact@v4
        with:
          name: Iris-HDR-Viewfinder-Test-V1.4.11-V2.25
          path: ${{ runner.temp }}/v1411v225-authority-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34057462644

      - name: Reconstruct exact V1.4.11 V2.25 authority and prove V1.4.11 V2.26 candidate before compilers
        shell: bash
        run: |
          set -euo pipefail
          IRIS_WORKFLOW_SYNTAX_ONLY=1 python3 scripts/verify_orientation.py
          authority='66b689922267396afa8b8cedf1ca848d1eabffcb'
          authority_tree='9253b753c8a808177e2cf166d30a52b109713318'
          authority_dir="$RUNNER_TEMP/v1411v225-authority-artifact"
          authority_src="$RUNNER_TEMP/v1411v225-authority-source"

          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = 'experiment-v1.4.11-v2-brightness-4ev'
          test "$(git rev-parse HEAD^)" = "$authority"
          test "$(git rev-parse "$authority^{tree}")" = "$authority_tree"
          cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml
          grep -Fq 'versionCode = 43' app/build.gradle.kts
          grep -Fq 'versionName = "1.0-v1.4.11-v2.26"' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'minSdk = 29' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          grep -Fq 'version "9.2.1"' build.gradle.kts
          sha256sum -c PACKAGE_MANIFEST_SHA256.txt

          test "$(sha256sum "$authority_dir/Iris-HDR-Viewfinder-Test-V1.4.11-V2.25-debug.apk" | awk '{print $1}')" = 'e240609a070fac9f0d8a480bff7065cb335f48155f905f6580d0d1cf5702b107'
          test "$(sha256sum "$authority_dir/Iris-HDR-Viewfinder-Test-V1.4.11-V2.25-source-candidate.tar" | awk '{print $1}')" = '305c5cd315b91cdd1986f9e9e01eb19fa192139f36a188f3cd797dd55ac993db'
          test "$(sha256sum "$authority_dir/RUNTIME_SOURCE_MANIFEST.tsv" | awk '{print $1}')" = '043b3e83585cae9a902e2267c2e246cdaebbb33682501ff5aa8f5548c2ebfe58'
          test "$(sha256sum "$authority_dir/REPOSITORY_SOURCE_MANIFEST.tsv" | awk '{print $1}')" = 'f82c0c1b516f6f188b73b68400dd587af661f4d3c67a3265f7b9ee4891d7037d'
          test "$(sha256sum "$authority_dir/REGRESSIONS.txt" | awk '{print $1}')" = '31adaadb04b36e7c8b8dc5307cce1dc95a18a89d9fd2fdbe4626dfe14cf28dd1'
          test "$(cat "$authority_dir/SOURCE_COMMIT.txt")" = "$authority"

          rm -rf "$authority_src"
          mkdir -p "$authority_src"
          tar -xf "$authority_dir/Iris-HDR-Viewfinder-Test-V1.4.11-V2.25-source-candidate.tar" -C "$authority_src"

          python3 - "$authority_src" "$authority_dir" <<'PY'
          from pathlib import Path
          import hashlib, subprocess, sys, tempfile

          src = Path(sys.argv[1])
          artifact = Path(sys.argv[2])
          expected_runtime_sha = '043b3e83585cae9a902e2267c2e246cdaebbb33682501ff5aa8f5548c2ebfe58'
          expected_repo_sha = 'f82c0c1b516f6f188b73b68400dd587af661f4d3c67a3265f7b9ee4891d7037d'

          def row(p, rel):
              b = p.read_bytes()
              lines = b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              return f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{rel}\n"

          runtime_files = sorted(p for p in (src / 'app/src').rglob('*') if p.is_file())
          if len(runtime_files) != 16:
              raise SystemExit(f'V1.4.11 V2.25 AUTHORITY RUNTIME COUNT FAIL: {len(runtime_files)}')
          runtime = ''.join(row(p, p.relative_to(src).as_posix()) for p in runtime_files).encode()
          if hashlib.sha256(runtime).hexdigest() != expected_runtime_sha:
              raise SystemExit('V1.4.11 V2.25 AUTHORITY RUNTIME MANIFEST SHA FAIL')
          if runtime != (artifact / 'RUNTIME_SOURCE_MANIFEST.tsv').read_bytes():
              raise SystemExit('V1.4.11 V2.25 AUTHORITY RUNTIME MANIFEST BYTE-EQUALITY FAIL')

          tracked = sorted(p for p in src.rglob('*') if p.is_file())
          if len(tracked) != 29:
              raise SystemExit(f'V1.4.11 V2.25 AUTHORITY REPOSITORY COUNT FAIL: {len(tracked)}')
          repo = ''.join(row(p, p.relative_to(src).as_posix()) for p in tracked).encode()
          if hashlib.sha256(repo).hexdigest() != expected_repo_sha:
              raise SystemExit('V1.4.11 V2.25 AUTHORITY REPOSITORY MANIFEST SHA FAIL')
          if repo != (artifact / 'REPOSITORY_SOURCE_MANIFEST.tsv').read_bytes():
              raise SystemExit('V1.4.11 V2.25 AUTHORITY REPOSITORY MANIFEST BYTE-EQUALITY FAIL')

          with tempfile.TemporaryDirectory() as td:
              tar_path = Path(td) / 'authority.tar'
              subprocess.run(['git', 'archive', '--format=tar', f'--output={tar_path}', '66b689922267396afa8b8cedf1ca848d1eabffcb'], check=True)
              checkout = Path(td) / 'git-archive'
              checkout.mkdir()
              subprocess.run(['tar', '-xf', str(tar_path), '-C', str(checkout)], check=True)
              git_files = sorted(p for p in checkout.rglob('*') if p.is_file())
              if [p.relative_to(checkout).as_posix() for p in git_files] != [p.relative_to(src).as_posix() for p in tracked]:
                  raise SystemExit('V1.4.11 V2.25 AUTHORITY ARTIFACT/GIT PATH SET FAIL')
              for gp, ap in zip(git_files, tracked):
                  if gp.read_bytes() != ap.read_bytes():
                      raise SystemExit(f'V1.4.11 V2.25 AUTHORITY ARTIFACT/GIT BYTE FAIL: {gp.relative_to(checkout)}')
          print('EXACT V1.4.11 V2.25 ACTIONS ARTIFACT AUTHORITY: PASS')
          PY

          bad_platform='platforms;android-37'
          if grep -Fq "sdkmanager \"$bad_platform\"" .github/workflows/build.yml; then
            echo 'REGRESSION FAIL 001: invalid API 37 package identifier survived' >&2
            exit 1
          fi
          if grep -RFn 'readAllBytes(' app/src/main/java; then
            echo 'REGRESSION FAIL 003: API-33 InputStream.readAllBytes survived minSdk 29 source' >&2
            exit 1
          fi
          if grep -RFn 'meta.timestampNs' app/src/main/java; then
            echo 'REGRESSION FAIL 015: failed V1.4 FrameMeta timestamp field reference returned' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          authority = '66b689922267396afa8b8cedf1ca848d1eabffcb'
          expected_changes = {
              '.github/workflows/build.yml': 'M',
              'BUILD_WORKFLOW_COPY.yml': 'M',
              'PACKAGE_INFO.txt': 'M',
              'PACKAGE_MANIFEST_SHA256.txt': 'M',
              'README.md': 'M',
              'VSCODE_DEV_UPLOAD.txt': 'M',
              'app/build.gradle.kts': 'M',
              'app/src/main/assets/shaders/hdr_display.frag': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java': 'M',
              'scripts/verify_orientation.py': 'M',
          }
          raw = subprocess.check_output(['git', 'diff', '--name-status', authority, 'HEAD'], text=True).splitlines()
          actual = {}
          for line in raw:
              parts = line.split('\t')
              actual[parts[-1]] = parts[0][0]
          if actual != expected_changes:
              raise SystemExit(f'V1.4.11 V2.26 ALLOWLIST FAIL: actual={actual} expected={expected_changes}')

          expected_tracked = [
              '.github/workflows/build.yml', '.gitignore', 'BUILD_WORKFLOW_COPY.yml',
              'PACKAGE_INFO.txt', 'PACKAGE_MANIFEST_SHA256.txt', 'README.md', 'VSCODE_DEV_UPLOAD.txt',
              'app/build.gradle.kts', 'app/src/main/AndroidManifest.xml',
              'app/src/main/assets/licenses/NAFNet_LICENSE.txt',
              'app/src/main/assets/nafnet_sidd_width32_fp16.tflite',
              'app/src/main/assets/shaders/copy_2d.frag',
              'app/src/main/assets/shaders/fullscreen.vert',
              'app/src/main/assets/shaders/hdr_display.frag',
              'app/src/main/assets/shaders/oes_to_rgb.frag',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrProcessingService.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/NafNetDenoiser.java',
              'build.gradle.kts', 'gradle.properties', 'scripts/verify_orientation.py',
              'scripts/verify_shaders.py', 'settings.gradle.kts',
          ]
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          if tracked != expected_tracked:
              raise SystemExit(f'REGRESSION FAIL 002: tracked mismatch actual={tracked}')

          files = sorted(p for p in Path('app/src').rglob('*') if p.is_file())
          if len(files) != 16:
              raise SystemExit(f'V1.4.11 V2.26 RUNTIME FILE COUNT FAIL: {len(files)}')
          rows=[]
          for p in files:
              b=p.read_bytes(); lines=b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              rows.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{p.as_posix()}\n")
          manifest=''.join(rows).encode()
          digest=hashlib.sha256(manifest).hexdigest()
          expected='36276eee01bcb15d98ecc8c51abf8b89442578f7c3bc1b6b7066fa78aeef7c9a'
          if digest != expected:
              raise SystemExit(f'V1.4.11 V2.26 RUNTIME MANIFEST FAIL: {digest} != {expected}')
          Path('bootstrap-runtime-manifest.tsv').write_bytes(manifest)

          protected = {
              'app/src/main/AndroidManifest.xml': 'e1299d6cf61cfcb79cbfe3e1e7d46f3ab2a11b65ba116d7f2d328b51d4180a92',
              'app/src/main/assets/licenses/NAFNet_LICENSE.txt': '71e12b4b6218af984e66cca1c3be81c6774828bc14c6eadde42007e317784e4f',
              'app/src/main/assets/nafnet_sidd_width32_fp16.tflite': 'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c',
              'app/src/main/assets/shaders/copy_2d.frag': 'b6b890e3be034a0d4980fd324fe0f469c7a2b0a126e958607bc8c4b9fbf97a55',
              'app/src/main/assets/shaders/fullscreen.vert': '7d8ee58c4500a46dd9614404a17ea4c7e104a6bf43976ecb85795799fdcd7fb4',
              'app/src/main/assets/shaders/oes_to_rgb.frag': '388d49929564efba24900794e035f88b461485f4da4f2e12caf71e3531ab6443',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java': '5de635a99bbe185e190c222f7b34f4add2bd2d52913f3cc54bb9b11d60806330',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java': 'e05484de966351424d3a5399eb159daccba766ed177c973b4b7529af014a60c5',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrProcessingService.java': '28fce3e4f8450d7579c1622ff832b3073a4707a181578e69a8b6a32ee90f5f8e',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java': '9699c51defa2a47e1d751f0c8d13d65da40677659fa87a448c1a0e71d2ba35ce',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java': 'a975fb65529c864a8bcefcded6c5df68fa881e7f97040734c6b0e326d27cc110',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/NafNetDenoiser.java': '53d988e32d87969f4b09a86b39a032467585b37ae1d1a909743d7469d4a97356',
          }
          for rel, sha in protected.items():
              got=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if got != sha:
                  raise SystemExit(f'V1.4.11 V2.26 PROTECTED RUNTIME FAIL: {rel} {got} != {sha}')

          # Permanent exact regression from failed V2.13 run 33900980849.
          camera_text = Path('app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java').read_text()
          gl_text = Path('app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java').read_text()
          if 'stats.shortP90Linear' in camera_text and not (
                  'final float shortP90Linear;' in gl_text
                  and 'this.shortP90Linear = shortP90Linear;' in gl_text
                  and 'percentileSorted(shortSorted, 0.90f),' in gl_text):
              raise SystemExit('REGRESSION FAIL 092: CameraController shortP90Linear consumer has no SceneStats P90 producer')
          print(f'V1.4.11 V2.26 MINIMUM CANDIDATE PASS: changed={len(actual)} runtime=16 digest={digest} protected={len(protected)}/{len(protected)}')
          PY

          # Canonical forward/rollback patches remain full-index binary Git patches.
          # Keep the successful V2.24 binary-aware projection mechanics unchanged: the exact
          # inherited NAFNet model path is excluded from GNU text replay and independently
          # hash-pinned, while canonical full-index forward/rollback remain proven by git apply.
          patch_sha=''
          rollback_sha=''
          text_patch_sha=''
          text_rollback_sha=''
          model_rel='app/src/main/assets/nafnet_sidd_width32_fp16.tflite'
          for abbrev in 7 12 40; do
            git -c core.abbrev="$abbrev" diff --binary --full-index "$authority" HEAD > "$RUNNER_TEMP/forward-$abbrev.patch"
            git -c core.abbrev="$abbrev" diff --binary --full-index HEAD "$authority" > "$RUNNER_TEMP/rollback-$abbrev.patch"
            git -c core.abbrev="$abbrev" diff --full-index "$authority" HEAD -- . ":(exclude)$model_rel" > "$RUNNER_TEMP/forward-text-$abbrev.patch"
            git -c core.abbrev="$abbrev" diff --full-index HEAD "$authority" -- . ":(exclude)$model_rel" > "$RUNNER_TEMP/rollback-text-$abbrev.patch"
            if test -z "$patch_sha"; then
              patch_sha="$(sha256sum "$RUNNER_TEMP/forward-$abbrev.patch" | awk '{print $1}')"
              rollback_sha="$(sha256sum "$RUNNER_TEMP/rollback-$abbrev.patch" | awk '{print $1}')"
              text_patch_sha="$(sha256sum "$RUNNER_TEMP/forward-text-$abbrev.patch" | awk '{print $1}')"
              text_rollback_sha="$(sha256sum "$RUNNER_TEMP/rollback-text-$abbrev.patch" | awk '{print $1}')"
            else
              test "$(sha256sum "$RUNNER_TEMP/forward-$abbrev.patch" | awk '{print $1}')" = "$patch_sha"
              test "$(sha256sum "$RUNNER_TEMP/rollback-$abbrev.patch" | awk '{print $1}')" = "$rollback_sha"
              test "$(sha256sum "$RUNNER_TEMP/forward-text-$abbrev.patch" | awk '{print $1}')" = "$text_patch_sha"
              test "$(sha256sum "$RUNNER_TEMP/rollback-text-$abbrev.patch" | awk '{print $1}')" = "$text_rollback_sha"
            fi
          done
          cmp -s "$RUNNER_TEMP/forward-7.patch" "$RUNNER_TEMP/forward-12.patch"
          cmp -s "$RUNNER_TEMP/forward-7.patch" "$RUNNER_TEMP/forward-40.patch"
          cmp -s "$RUNNER_TEMP/rollback-7.patch" "$RUNNER_TEMP/rollback-12.patch"
          cmp -s "$RUNNER_TEMP/rollback-7.patch" "$RUNNER_TEMP/rollback-40.patch"
          cmp -s "$RUNNER_TEMP/forward-text-7.patch" "$RUNNER_TEMP/forward-text-12.patch"
          cmp -s "$RUNNER_TEMP/forward-text-7.patch" "$RUNNER_TEMP/forward-text-40.patch"
          cmp -s "$RUNNER_TEMP/rollback-text-7.patch" "$RUNNER_TEMP/rollback-text-12.patch"
          cmp -s "$RUNNER_TEMP/rollback-text-7.patch" "$RUNNER_TEMP/rollback-text-40.patch"
          cp "$RUNNER_TEMP/forward-7.patch" "$RUNNER_TEMP/V1.4.11-V2.25_to_V1.4.11-V2.26.forward.patch"
          cp "$RUNNER_TEMP/rollback-7.patch" "$RUNNER_TEMP/V1.4.11-V2.26_to_V1.4.11-V2.25.rollback.patch"

          python3 - "$authority_src" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/V1.4.11-V2.25_to_V1.4.11-V2.26.forward.patch" "$RUNNER_TEMP/V1.4.11-V2.26_to_V1.4.11-V2.25.rollback.patch" "$RUNNER_TEMP/forward-text-7.patch" "$RUNNER_TEMP/rollback-text-7.patch" "$model_rel" <<'PY'
          from pathlib import Path
          import hashlib, shutil, subprocess, sys, tempfile
          authority, candidate, forward, rollback, forward_text, rollback_text = map(Path, sys.argv[1:7])
          model_rel = sys.argv[7]
          model_sha = 'f8fbaa422411683c53e802cf7cc7cf9be0a0de00886ad4af057232e26b172a0c'
          candidate_paths = subprocess.check_output(['git', '-C', str(candidate), 'ls-files'], text=True).splitlines()
          authority_paths = sorted(p.relative_to(authority).as_posix() for p in authority.rglob('*') if p.is_file())

          def compare(left, right, expected, label):
              left_paths = sorted(p.relative_to(left).as_posix() for p in left.rglob('*') if p.is_file())
              right_paths = sorted(rel for rel in expected if (right / rel).is_file())
              if left_paths != sorted(expected):
                  raise SystemExit(f'{label} LEFT PATH SET FAIL: {left_paths} != {sorted(expected)}')
              if right_paths != sorted(expected):
                  raise SystemExit(f'{label} RIGHT PATH SET FAIL: {right_paths} != {sorted(expected)}')
              for rel in expected:
                  if (left/rel).read_bytes() != (right/rel).read_bytes():
                      raise SystemExit(f'{label} BYTE FAIL: {rel}')

          with tempfile.TemporaryDirectory() as td:
              t=Path(td)
              g=t/'git-apply'; shutil.copytree(authority, g)
              subprocess.run(['git','apply',str(forward)],cwd=g,check=True)
              compare(g,candidate,candidate_paths,'GIT FULL-BINARY FORWARD')
              subprocess.run(['git','apply',str(rollback)],cwd=g,check=True)
              compare(g,authority,authority_paths,'GIT FULL-BINARY ROLLBACK')

              p=t/'gnu-patch'; shutil.copytree(authority,p)
              model_src = candidate / model_rel
              model_dst = p / model_rel
              if (not model_src.is_file() or not model_dst.is_file()
                      or hashlib.sha256(model_src.read_bytes()).hexdigest() != model_sha
                      or hashlib.sha256(model_dst.read_bytes()).hexdigest() != model_sha):
                  raise SystemExit('GNU FUZZ0 INHERITED MODEL SHA FAIL')
              subprocess.run(['patch','-p1','--fuzz=0','-i',str(forward_text)],cwd=p,check=True)
              if hashlib.sha256(model_dst.read_bytes()).hexdigest() != model_sha:
                  raise SystemExit('GNU FUZZ0 FORWARD MODEL INVARIANCE FAIL')
              compare(p,candidate,candidate_paths,'GNU FUZZ0 TEXT+PINNED-BINARY FORWARD')
              subprocess.run(['patch','-p1','--fuzz=0','-i',str(rollback_text)],cwd=p,check=True)
              if hashlib.sha256(model_dst.read_bytes()).hexdigest() != model_sha:
                  raise SystemExit('GNU FUZZ0 ROLLBACK MODEL INVARIANCE FAIL')
              compare(p,authority,authority_paths,'GNU FUZZ0 TEXT+PINNED-BINARY ROLLBACK')
          print('FORWARD/ROLLBACK PATCH REPLAY: PASS (canonical full-index git apply + GNU fuzz=0 text projection with exact inherited model pin)')
          PY
          printf '%s\n' "$patch_sha" > "$RUNNER_TEMP/FORWARD_PATCH_SHA256.txt"
          printf '%s\n' "$rollback_sha" > "$RUNNER_TEMP/ROLLBACK_PATCH_SHA256.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and prove Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > "$RUNNER_TEMP/sdkmanager-list.txt"
          grep -Fq 'platforms;android-37.0' "$RUNNER_TEMP/sdkmanager-list.txt"
          sdkmanager "platforms;android-37.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install pinned real GLSL compiler
        shell: bash
        run: |
          set -euo pipefail
          expected='15.1.0-2~ubuntu0.24.04.2'
          sudo apt-get update
          sudo apt-get install -y "glslang-tools=$expected"
          test "$(dpkg-query -W -f='${Version}' glslang-tools)" = "$expected"
          glslangValidator --version

      - name: Scan complete GLSL reserved identifiers
        shell: bash
        run: python3 scripts/verify_shaders.py

      - name: Compile exact runtime GLSL assets
        shell: bash
        run: |
          set -euo pipefail
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/oes_to_rgb.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/copy_2d.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/hdr_display.frag

      - name: Compile modified Java with real project compiler
        shell: bash
        run: gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac

      - name: Replay V1.4.11 V2.26 runtime regressions on compiler-tested candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_orientation.py
          python3 scripts/verify_shaders.py

      - name: Build full debug APK from frozen compiler-tested candidate
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Post-build invariance and freeze compiled V1.4.11 V2.26 candidate
        shell: bash
        run: |
          set -euo pipefail
