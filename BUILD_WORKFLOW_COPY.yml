name: Build Iris HDR Viewfinder Test V1.4.11 V2.2

on:
  workflow_dispatch:
  push:
    branches: [ experiment-v1.4.11-v2-brightness-4ev ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - 'BUILD_WORKFLOW_COPY.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate history
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Download exact successful V1.4.11 V2.1 Actions authority artifact
        uses: actions/download-artifact@v4
        with:
          name: Iris-HDR-Viewfinder-Test-V1.4.11-V2.1
          path: ${{ runner.temp }}/v1411v21-authority-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33675083158

      - name: Reconstruct exact V1.4.11 V2.1 authority and prove V1.4.11 V2.2 candidate before compilers
        shell: bash
        run: |
          set -euo pipefail
          IRIS_WORKFLOW_SYNTAX_ONLY=1 python3 scripts/verify_orientation.py
          authority='6057b8e22dbe98a6f386d9026d6ab9dbec65884c'
          authority_tree='3311a9f3e8b679e6a5925520123ab97244e0840e'
          authority_dir="$RUNNER_TEMP/v1411v21-authority-artifact"
          authority_src="$RUNNER_TEMP/v1411v21-authority-source"

          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$GITHUB_REF_NAME" = 'experiment-v1.4.11-v2-brightness-4ev'
          test "$(git rev-parse HEAD^)" = "$authority"
          test "$(git rev-parse "$authority^{tree}")" = "$authority_tree"
          cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml
          grep -Fq 'versionCode = 19' app/build.gradle.kts
          grep -Fq 'versionName = "1.0-v1.4.11-v2.2"' app/build.gradle.kts
          grep -Fq 'compileSdk = 37' app/build.gradle.kts
          grep -Fq 'minSdk = 29' app/build.gradle.kts
          grep -Fq 'targetSdk = 37' app/build.gradle.kts
          grep -Fq 'version "9.2.1"' build.gradle.kts
          sha256sum -c PACKAGE_MANIFEST_SHA256.txt

          test "$(sha256sum "$authority_dir/Iris-HDR-Viewfinder-Test-V1.4.11-V2.1-debug.apk" | awk '{print $1}')" = '628cd5e8cbb9c3c9c6462a52eb539c744b67c835eb5db3f7d8d8646a57a0044e'
          test "$(sha256sum "$authority_dir/Iris-HDR-Viewfinder-Test-V1.4.11-V2.1-source-candidate.tar" | awk '{print $1}')" = '66d18a2015b17c2b7392d2341ecd2bdc4270b35c8462b08487efb6dd4ffde74c'
          test "$(sha256sum "$authority_dir/RUNTIME_SOURCE_MANIFEST.tsv" | awk '{print $1}')" = 'a0fb882a151c45e8193b60ad36fb9be5cdf11ec435c1590d636f3008bfe9ddf1'
          test "$(sha256sum "$authority_dir/REPOSITORY_SOURCE_MANIFEST.tsv" | awk '{print $1}')" = '7e18e3b2c30b66e582a1bcf127ddbb41ad24e0e128a5250d2af11f9b66f1ee6d'
          test "$(sha256sum "$authority_dir/REGRESSIONS.txt" | awk '{print $1}')" = '2ab4ea97ffb0f5f34223ce615c360ce66984d323d201db014b67619d1a278ae3'
          test "$(cat "$authority_dir/SOURCE_COMMIT.txt")" = "$authority"

          rm -rf "$authority_src"
          mkdir -p "$authority_src"
          tar -xf "$authority_dir/Iris-HDR-Viewfinder-Test-V1.4.11-V2.1-source-candidate.tar" -C "$authority_src"

          python3 - "$authority_src" "$authority_dir" <<'PY'
          from pathlib import Path
          import hashlib, subprocess, sys, tempfile

          src = Path(sys.argv[1])
          artifact = Path(sys.argv[2])
          expected_runtime_sha = 'a0fb882a151c45e8193b60ad36fb9be5cdf11ec435c1590d636f3008bfe9ddf1'
          expected_repo_sha = '7e18e3b2c30b66e582a1bcf127ddbb41ad24e0e128a5250d2af11f9b66f1ee6d'

          def row(p, rel):
              b = p.read_bytes()
              lines = b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              return f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{rel}\n"

          runtime_files = sorted(p for p in (src / 'app/src').rglob('*') if p.is_file())
          if len(runtime_files) != 12:
              raise SystemExit(f'V1.4.11 V2.1 AUTHORITY RUNTIME COUNT FAIL: {len(runtime_files)}')
          runtime = ''.join(row(p, p.relative_to(src).as_posix()) for p in runtime_files).encode()
          if hashlib.sha256(runtime).hexdigest() != expected_runtime_sha:
              raise SystemExit('V1.4.11 V2.1 AUTHORITY RUNTIME MANIFEST SHA FAIL')
          if runtime != (artifact / 'RUNTIME_SOURCE_MANIFEST.tsv').read_bytes():
              raise SystemExit('V1.4.11 V2.1 AUTHORITY RUNTIME MANIFEST BYTE-EQUALITY FAIL')

          tracked = sorted(p for p in src.rglob('*') if p.is_file())
          if len(tracked) != 25:
              raise SystemExit(f'V1.4.11 V2.1 AUTHORITY REPOSITORY COUNT FAIL: {len(tracked)}')
          repo = ''.join(row(p, p.relative_to(src).as_posix()) for p in tracked).encode()
          if hashlib.sha256(repo).hexdigest() != expected_repo_sha:
              raise SystemExit('V1.4.11 V2.1 AUTHORITY REPOSITORY MANIFEST SHA FAIL')
          if repo != (artifact / 'REPOSITORY_SOURCE_MANIFEST.tsv').read_bytes():
              raise SystemExit('V1.4.11 V2.1 AUTHORITY REPOSITORY MANIFEST BYTE-EQUALITY FAIL')

          with tempfile.TemporaryDirectory() as td:
              tar_path = Path(td) / 'authority.tar'
              subprocess.run(['git', 'archive', '--format=tar', f'--output={tar_path}', '6057b8e22dbe98a6f386d9026d6ab9dbec65884c'], check=True)
              checkout = Path(td) / 'git-archive'
              checkout.mkdir()
              subprocess.run(['tar', '-xf', str(tar_path), '-C', str(checkout)], check=True)
              git_files = sorted(p for p in checkout.rglob('*') if p.is_file())
              if [p.relative_to(checkout).as_posix() for p in git_files] != [p.relative_to(src).as_posix() for p in tracked]:
                  raise SystemExit('V1.4.11 V2.1 AUTHORITY ARTIFACT/GIT PATH SET FAIL')
              for gp, ap in zip(git_files, tracked):
                  if gp.read_bytes() != ap.read_bytes():
                      raise SystemExit(f'V1.4.11 V2.1 AUTHORITY ARTIFACT/GIT BYTE FAIL: {gp.relative_to(checkout)}')
          print('EXACT V1.4.11 V2.1 ACTIONS ARTIFACT AUTHORITY: PASS')
          PY

          bad_platform='platforms;android-37'
          if grep -Fq "sdkmanager \"$bad_platform\"" .github/workflows/build.yml; then
            echo 'REGRESSION FAIL 001: invalid API 37 package identifier survived' >&2
            exit 1
          fi
          if grep -RFn 'readAllBytes(' app/src/main/java; then
            echo 'REGRESSION FAIL 003: API-33 InputStream.readAllBytes survived minSdk 29 source' >&2
            exit 1
          fi
          if grep -RFn 'meta.timestampNs' app/src/main/java; then
            echo 'REGRESSION FAIL 015: failed V1.4 FrameMeta timestamp field reference returned' >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess

          authority = '6057b8e22dbe98a6f386d9026d6ab9dbec65884c'
          expected_changes = {
              '.github/workflows/build.yml': 'M',
              'BUILD_WORKFLOW_COPY.yml': 'M',
              'PACKAGE_INFO.txt': 'M',
              'PACKAGE_MANIFEST_SHA256.txt': 'M',
              'README.md': 'M',
              'VSCODE_DEV_UPLOAD.txt': 'M',
              'app/build.gradle.kts': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java': 'M',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java': 'M',
              'scripts/verify_orientation.py': 'M',
          }
          raw = subprocess.check_output(['git', 'diff', '--name-status', authority, 'HEAD'], text=True).splitlines()
          actual = {}
          for line in raw:
              parts = line.split('\t')
              actual[parts[-1]] = parts[0][0]
          if actual != expected_changes:
              raise SystemExit(f'V1.4.11 V2.2 ALLOWLIST FAIL: actual={actual} expected={expected_changes}')

          expected_tracked = [
              '.github/workflows/build.yml', '.gitignore', 'BUILD_WORKFLOW_COPY.yml',
              'PACKAGE_INFO.txt', 'PACKAGE_MANIFEST_SHA256.txt', 'README.md', 'VSCODE_DEV_UPLOAD.txt',
              'app/build.gradle.kts', 'app/src/main/AndroidManifest.xml',
              'app/src/main/assets/shaders/copy_2d.frag',
              'app/src/main/assets/shaders/fullscreen.vert',
              'app/src/main/assets/shaders/hdr_display.frag',
              'app/src/main/assets/shaders/oes_to_rgb.frag',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CameraController.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/HdrGlView.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MainActivity.java',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java',
              'build.gradle.kts', 'gradle.properties', 'scripts/verify_orientation.py',
              'scripts/verify_shaders.py', 'settings.gradle.kts',
          ]
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          if tracked != expected_tracked:
              raise SystemExit(f'REGRESSION FAIL 002: tracked mismatch actual={tracked}')

          files = sorted(p for p in Path('app/src').rglob('*') if p.is_file())
          if len(files) != 12:
              raise SystemExit(f'V1.4.11 V2.2 RUNTIME FILE COUNT FAIL: {len(files)}')
          rows=[]
          for p in files:
              b=p.read_bytes(); lines=b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              rows.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{p.as_posix()}\n")
          manifest=''.join(rows).encode()
          digest=hashlib.sha256(manifest).hexdigest()
          expected='837b515f0e0e8b83ec05eaa1a23aa362379787cb037e53c0cb6c86498f86eb98'
          if digest != expected:
              raise SystemExit(f'V1.4.11 V2.2 RUNTIME MANIFEST FAIL: {digest} != {expected}')
          Path('bootstrap-runtime-manifest.tsv').write_bytes(manifest)

          protected = {
              'app/src/main/AndroidManifest.xml': '1895ba57dce9a0cffa0113bd3b5708b232e3c42e7b1d304630d7f974153900bd',
              'app/src/main/assets/shaders/copy_2d.frag': 'b6b890e3be034a0d4980fd324fe0f469c7a2b0a126e958607bc8c4b9fbf97a55',
              'app/src/main/assets/shaders/fullscreen.vert': '7d8ee58c4500a46dd9614404a17ea4c7e104a6bf43976ecb85795799fdcd7fb4',
              'app/src/main/assets/shaders/hdr_display.frag': 'cc8d54a5a92ef00dd9f13470e562c76bb326d88a21ce7a3ce42ce1489de90703',
              'app/src/main/assets/shaders/oes_to_rgb.frag': '388d49929564efba24900794e035f88b461485f4da4f2e12caf71e3531ab6443',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java': '2bda251dfedf78103d2dce21371956674541c96cf59805f1040eabe8c2fa310e',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java': 'e05484de966351424d3a5399eb159daccba766ed177c973b4b7529af014a60c5',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java': '58b0bf3aeef61ce85dd8117cec1dcb1b9332233b4eeb923ac949715ec1c8bb48',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java': 'a975fb65529c864a8bcefcded6c5df68fa881e7f97040734c6b0e326d27cc110',
          }
          for rel, sha in protected.items():
              got=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if got != sha:
                  raise SystemExit(f'V1.4.11 V2.2 PROTECTED RUNTIME FAIL: {rel} {got} != {sha}')
          print(f'V1.4.11 V2.2 MINIMUM CANDIDATE PASS: changed={len(actual)} runtime=12 digest={digest} protected={len(protected)}/{len(protected)}')
          PY

          patch_sha=''
          rollback_sha=''
          for abbrev in 7 12 40; do
            git -c core.abbrev="$abbrev" diff --binary --full-index "$authority" HEAD > "$RUNNER_TEMP/forward-$abbrev.patch"
            git -c core.abbrev="$abbrev" diff --binary --full-index HEAD "$authority" > "$RUNNER_TEMP/rollback-$abbrev.patch"
            if test -z "$patch_sha"; then
              patch_sha="$(sha256sum "$RUNNER_TEMP/forward-$abbrev.patch" | awk '{print $1}')"
              rollback_sha="$(sha256sum "$RUNNER_TEMP/rollback-$abbrev.patch" | awk '{print $1}')"
            else
              test "$(sha256sum "$RUNNER_TEMP/forward-$abbrev.patch" | awk '{print $1}')" = "$patch_sha"
              test "$(sha256sum "$RUNNER_TEMP/rollback-$abbrev.patch" | awk '{print $1}')" = "$rollback_sha"
            fi
          done
          cmp -s "$RUNNER_TEMP/forward-7.patch" "$RUNNER_TEMP/forward-12.patch"
          cmp -s "$RUNNER_TEMP/forward-7.patch" "$RUNNER_TEMP/forward-40.patch"
          cmp -s "$RUNNER_TEMP/rollback-7.patch" "$RUNNER_TEMP/rollback-12.patch"
          cmp -s "$RUNNER_TEMP/rollback-7.patch" "$RUNNER_TEMP/rollback-40.patch"
          cp "$RUNNER_TEMP/forward-7.patch" "$RUNNER_TEMP/V1.4.11-V2.1_to_V1.4.11-V2.2.forward.patch"
          cp "$RUNNER_TEMP/rollback-7.patch" "$RUNNER_TEMP/V1.4.11-V2.2_to_V1.4.11-V2.1.rollback.patch"

          python3 - "$authority_src" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/V1.4.11-V2.1_to_V1.4.11-V2.2.forward.patch" "$RUNNER_TEMP/V1.4.11-V2.2_to_V1.4.11-V2.1.rollback.patch" <<'PY'
          from pathlib import Path
          import shutil, subprocess, sys, tempfile
          authority, candidate, forward, rollback = map(Path, sys.argv[1:])
          tracked = subprocess.check_output(['git', '-C', str(candidate), 'ls-files'], text=True).splitlines()
          def compare(left, right, label):
              for rel in tracked:
                  a=(left/rel).read_bytes(); b=(right/rel).read_bytes()
                  if a != b: raise SystemExit(f'{label} BYTE FAIL: {rel}')
          with tempfile.TemporaryDirectory() as td:
              t=Path(td)
              g=t/'git-apply'; shutil.copytree(authority, g)
              subprocess.run(['git','apply',str(forward)],cwd=g,check=True)
              compare(g,candidate,'GIT FORWARD')
              subprocess.run(['git','apply',str(rollback)],cwd=g,check=True)
              compare(g,authority,'GIT ROLLBACK')
              p=t/'gnu-patch'; shutil.copytree(authority,p)
              subprocess.run(['patch','-p1','--fuzz=0','-i',str(forward)],cwd=p,check=True)
              compare(p,candidate,'GNU FUZZ0 FORWARD')
              subprocess.run(['patch','-p1','--fuzz=0','-i',str(rollback)],cwd=p,check=True)
              compare(p,authority,'GNU FUZZ0 ROLLBACK')
          print('FORWARD/ROLLBACK PATCH REPLAY: PASS')
          PY
          printf '%s\n' "$patch_sha" > "$RUNNER_TEMP/FORWARD_PATCH_SHA256.txt"
          printf '%s\n' "$rollback_sha" > "$RUNNER_TEMP/ROLLBACK_PATCH_SHA256.txt"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and prove Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list > "$RUNNER_TEMP/sdkmanager-list.txt"
          grep -Fq 'platforms;android-37.0' "$RUNNER_TEMP/sdkmanager-list.txt"
          sdkmanager "platforms;android-37.0"
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install pinned real GLSL compiler
        shell: bash
        run: |
          set -euo pipefail
          expected='15.1.0-2~ubuntu0.24.04.2'
          sudo apt-get update
          sudo apt-get install -y "glslang-tools=$expected"
          test "$(dpkg-query -W -f='${Version}' glslang-tools)" = "$expected"
          glslangValidator --version

      - name: Scan complete GLSL reserved identifiers
        shell: bash
        run: python3 scripts/verify_shaders.py

      - name: Compile exact runtime GLSL assets
        shell: bash
        run: |
          set -euo pipefail
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/oes_to_rgb.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/copy_2d.frag
          glslangValidator -l app/src/main/assets/shaders/fullscreen.vert app/src/main/assets/shaders/hdr_display.frag

      - name: Compile modified Java with real project compiler
        shell: bash
        run: gradle --no-daemon --stacktrace :app:compileDebugJavaWithJavac

      - name: Replay V1.4.11 V2.2 runtime regressions on compiler-tested candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_orientation.py
          python3 scripts/verify_shaders.py

      - name: Build full debug APK from frozen compiler-tested candidate
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Post-build invariance and freeze compiled V1.4.11 V2.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .
          python3 scripts/verify_orientation.py
          python3 scripts/verify_shaders.py
          sha256sum -c PACKAGE_MANIFEST_SHA256.txt
          cmp -s .github/workflows/build.yml BUILD_WORKFLOW_COPY.yml

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          expected_runtime='837b515f0e0e8b83ec05eaa1a23aa362379787cb037e53c0cb6c86498f86eb98'
          files=sorted(p for p in Path('app/src').rglob('*') if p.is_file())
          rows=[]
          for p in files:
              b=p.read_bytes(); lines=b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              rows.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{p.as_posix()}\n")
          manifest=''.join(rows).encode(); digest=hashlib.sha256(manifest).hexdigest()
          if len(files)!=12 or digest!=expected_runtime:
              raise SystemExit(f'POST-BUILD RUNTIME INVARIANCE FAIL files={len(files)} digest={digest}')
          Path('compiled-runtime-manifest.tsv').write_bytes(manifest)
          tracked=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          if len(tracked) != 25:
              raise SystemExit(f'POST-BUILD TRACKED COUNT FAIL: {len(tracked)}')
          repo=[]
          for rel in tracked:
              b=Path(rel).read_bytes(); lines=b.count(b'\n') + (1 if b and not b.endswith(b'\n') else 0)
              repo.append(f"{hashlib.sha256(b).hexdigest()}\t{len(b)}\t{lines}\t{rel}\n")
          Path('compiled-repository-manifest.tsv').write_text(''.join(repo))
          protected = {
              'app/src/main/AndroidManifest.xml': '1895ba57dce9a0cffa0113bd3b5708b232e3c42e7b1d304630d7f974153900bd',
              'app/src/main/assets/shaders/copy_2d.frag': 'b6b890e3be034a0d4980fd324fe0f469c7a2b0a126e958607bc8c4b9fbf97a55',
              'app/src/main/assets/shaders/fullscreen.vert': '7d8ee58c4500a46dd9614404a17ea4c7e104a6bf43976ecb85795799fdcd7fb4',
              'app/src/main/assets/shaders/hdr_display.frag': 'cc8d54a5a92ef00dd9f13470e562c76bb326d88a21ce7a3ce42ce1489de90703',
              'app/src/main/assets/shaders/oes_to_rgb.frag': '388d49929564efba24900794e035f88b461485f4da4f2e12caf71e3531ab6443',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/CaptureSetSaver.java': '2bda251dfedf78103d2dce21371956674541c96cf59805f1040eabe8c2fa310e',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/FrameMeta.java': 'e05484de966351424d3a5399eb159daccba766ed177c973b4b7529af014a60c5',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/JpegFusion.java': '58b0bf3aeef61ce85dd8117cec1dcb1b9332233b4eeb923ac949715ec1c8bb48',
              'app/src/main/java/com/skyking0007/irishdrviewfinder/MediaStoreWriter.java': 'a975fb65529c864a8bcefcded6c5df68fa881e7f97040734c6b0e326d27cc110',
          }
          for rel, expected in protected.items():
              got=hashlib.sha256(Path(rel).read_bytes()).hexdigest()
              if got != expected: raise SystemExit(f'POST-BUILD PROTECTED FAIL: {rel}')
          print('POST-BUILD FROZEN-CANDIDATE/PROTECTED INVARIANCE: PASS')
          PY

          mapfile -t apks < <(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print | sort)
          test ${#apks[@]} -eq 1
          mkdir -p output
          cp "${apks[0]}" output/Iris-HDR-Viewfinder-Test-V1.4.11-V2.2-debug.apk
          git archive --format=tar --output=output/Iris-HDR-Viewfinder-Test-V1.4.11-V2.2-source-candidate.tar "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > output/SOURCE_COMMIT.txt
          cp compiled-runtime-manifest.tsv output/RUNTIME_SOURCE_MANIFEST.tsv
          cp compiled-repository-manifest.tsv output/REPOSITORY_SOURCE_MANIFEST.tsv
          cp "$RUNNER_TEMP/V1.4.11-V2.1_to_V1.4.11-V2.2.forward.patch" output/V1.4.11-V2.1_to_V1.4.11-V2.2.forward.patch
          cp "$RUNNER_TEMP/V1.4.11-V2.2_to_V1.4.11-V2.1.rollback.patch" output/V1.4.11-V2.2_to_V1.4.11-V2.1.rollback.patch
          cp "$RUNNER_TEMP/FORWARD_PATCH_SHA256.txt" output/FORWARD_PATCH_SHA256.txt
          cp "$RUNNER_TEMP/ROLLBACK_PATCH_SHA256.txt" output/ROLLBACK_PATCH_SHA256.txt
          cat > output/REGRESSIONS.txt <<'REGRESSIONS'
